#this file placed in the /etc/nginx directory and is used to configure the Nginx web server. It defines the events and HTTP settings, including a server block that listens on port 80 and proxies requests to a backend server running on localhost at port 8000. The configuration also sets various headers to pass along client information to the backend server.after starting the server just go to browser and type the server name in the address bar to access the application running on the backend server.

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name Khushwant;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
